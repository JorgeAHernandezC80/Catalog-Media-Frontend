<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartelera · Catálogo de Media</title>
  <meta name="description" content="Cartelera de películas y series del Catálogo de Media.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/cartelera.css">
</head>
<body class="cartelera">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <div class="cabecera-interior">
      <a class="marca" href="index.html">
        <!-- Columna clásica, como la fachada de un teatro -->
        <svg class="marca-icono" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M5 9h30l-3 4H8z M9 14h22v2H9z M11 17h3v15h-3z M18.5 17h3v15h-3z M26 17h3v15h-3z M8 33h24v2H8z M5 36h30v2H5z" fill="currentColor"/>
        </svg>
        Catálogo de Media
      </a>
      <nav aria-label="Principal">
        <ul>
          <li><a href="index.html" aria-current="page">Cartelera</a></li>
          <li><a href="#catalogo">Catálogo</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <!-- Escenario: la producción destacada (la última agregada al catálogo).
         Mientras carga, la clase "cargando" muestra esqueletos en vez de texto. -->
    <section class="escenario cargando" id="escenario" aria-labelledby="destacada-titulo" aria-busy="true">
      <div class="telon telon-izquierdo" aria-hidden="true"></div>
      <div class="telon telon-derecho" aria-hidden="true"></div>

      <div class="escenario-interior">
        <div class="destacada-texto">
          <p class="etiqueta" id="destacada-etiqueta">Película destacada</p>
          <h1 id="destacada-titulo"><span class="esqueleto esqueleto-titulo" aria-hidden="true"></span><span class="solo-lectores">Cargando la cartelera</span></h1>
          <p class="destacada-meta" id="destacada-meta"><span class="esqueleto esqueleto-linea" aria-hidden="true"></span></p>
          <p class="destacada-sinopsis" id="destacada-sinopsis">
            <span class="esqueleto esqueleto-linea" aria-hidden="true"></span>
            <span class="esqueleto esqueleto-linea" aria-hidden="true"></span>
            <span class="esqueleto esqueleto-linea corta" aria-hidden="true"></span>
          </p>
          <div class="destacada-acciones" id="destacada-acciones"></div>
        </div>

        <figure class="destacada-portada" id="destacada-portada">
          <div class="destacada-imagen esqueleto" id="destacada-imagen"></div>
        </figure>

        <!-- Carrete con el haz del proyector. Solo decoración. -->
        <div class="proyector" aria-hidden="true">
          <div class="haz"><div class="haz-luz"></div></div>
          <svg class="carrete" viewBox="0 0 300 300">
            <defs>
              <radialGradient id="metal" cx="40%" cy="35%" r="75%">
                <stop offset="0" stop-color="#8d929c"/>
                <stop offset="0.55" stop-color="#4a4f59"/>
                <stop offset="1" stop-color="#1c1f26"/>
              </radialGradient>
              <radialGradient id="lente" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="0.35" stop-color="#8fb8ff"/>
                <stop offset="1" stop-color="#1d3f8f" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="150" cy="150" r="146" fill="url(#metal)"/>
            <circle cx="150" cy="150" r="138" fill="none" stroke="#2a2e36" stroke-width="3"/>
            <circle cx="150" cy="150" r="128" fill="none" stroke="#9aa0aa" stroke-opacity="0.35" stroke-width="1.5"/>
            <g fill="#090b10" stroke="#6d727c" stroke-width="2">
              <circle cx="150" cy="68" r="38"/>
              <circle cx="221" cy="109" r="38"/>
              <circle cx="221" cy="191" r="38"/>
              <circle cx="150" cy="232" r="38"/>
              <circle cx="79" cy="191" r="38"/>
              <circle cx="79" cy="109" r="38"/>
            </g>
            <circle cx="150" cy="150" r="30" fill="#2c3038" stroke="#9aa0aa" stroke-width="2"/>
            <circle cx="150" cy="150" r="12" fill="#0b0d12"/>
            <circle cx="150" cy="150" r="22" fill="url(#lente)"/>
          </svg>
        </div>

        <!-- Cinta de celuloide con las portadas del catálogo como fotogramas. Solo decoración. -->
        <div class="cinta" id="cinta-contenedor" aria-hidden="true" hidden>
          <div class="cinta-cuadros" id="cinta"></div>
        </div>
      </div>

      <div class="cifras">
        <ul>
          <li><strong data-cifra="media">—</strong> producciones en cartelera</li>
          <li><strong data-cifra="generos">—</strong> géneros</li>
          <li><strong data-cifra="directores">—</strong> directores</li>
        </ul>
        <a class="descubrir" href="#catalogo">Descubre el catálogo <span class="descubrir-linea" aria-hidden="true"></span></a>
      </div>
    </section>

    <div class="contenedor">
      <div id="mensaje"></div>

      <section id="catalogo" aria-labelledby="titulo-cartelera">
        <div class="cartelera-cabecera">
          <div>
            <p class="etiqueta">En cartelera</p>
            <h2 id="titulo-cartelera">Todo el catálogo</h2>
          </div>
          <p class="cartelera-total" id="cartelera-total" aria-live="polite"></p>
        </div>

        <div class="herramientas">
          <div class="buscador">
            <label for="buscar">Buscar por título</label>
            <input id="buscar" type="search" placeholder="Ej.: Wildwood" autocomplete="off">
          </div>
          <div class="grupo-filtro" role="group" aria-label="Filtrar por tipo" id="filtro-tipo"></div>
        </div>
        <div class="grupo-filtro filtro-generos" role="group" aria-label="Filtrar por género" id="filtro-genero"></div>

        <p class="cartelera-estado" id="cartelera-estado" hidden></p>
        <!-- Mientras carga se muestran pósters "esqueleto"; js/inicio.js los reemplaza. -->
        <ul class="funciones" id="funciones" aria-busy="true">
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
          <li class="funcion-esqueleto" aria-hidden="true"><span class="esqueleto"></span></li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="pie">
    <p>Catálogo de Media</p>
    <a class="pie-gestionar" href="media.html">Gestionar</a>
  </footer>

  <!-- Ficha de una producción. Se llena desde js/inicio.js al hacer clic en un póster. -->
  <dialog id="detalle" class="detalle" aria-labelledby="detalle-titulo">
    <div class="detalle-interior">
      <div class="detalle-portada" id="detalle-portada"></div>
      <div class="detalle-texto">
        <h2 id="detalle-titulo"></h2>
        <p class="destacada-meta" id="detalle-meta"></p>
        <ul class="generos" id="detalle-generos" aria-label="Géneros"></ul>
        <p class="detalle-sinopsis" id="detalle-sinopsis"></p>
        <dl class="detalle-ficha" id="detalle-ficha"></dl>
        <div class="detalle-acciones">
          <a class="boton-oro" id="detalle-enlace" target="_blank" rel="noopener noreferrer">
            Ver producción
            <svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1l10 6-10 6z" fill="currentColor"/></svg>
          </a>
          <form method="dialog"><button class="boton-texto">Cerrar</button></form>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/inicio.js"></script>
</body>
</html>
